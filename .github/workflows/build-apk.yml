name: Build FF Network Connect APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_mihomo_native:
        description: "Optional: Also compile WhiteVPN/FlClash Mihomo native core (adds ~8 min)"
        required: false
        default: "false"
        type: boolean

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-extract ZIP if uploaded directly to repo root
        run: |
          if [ -f "FFNetworkConnect_Android_Source.zip" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "Extracting FFNetworkConnect_Android_Source.zip..."
            unzip -o FFNetworkConnect_Android_Source.zip -d .
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Android SDK 35 via sdkmanager
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run Unit & Security Regression Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload FF Network Connect APK
        uses: actions/upload-artifact@v4
        with:
          name: FFNetworkConnect-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Unit Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/test-results/testDebugUnitTest/
